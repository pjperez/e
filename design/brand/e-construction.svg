.2 242.9 -290.4C246.4 -288.7 249.9 -286.9 253.4 -285C256.9 -283.1 260.4 -281.2 263.8 -279.3C267.2 -277.3 270.7 -275.3 274 -273.2C277.4 -271.1 280.8 -269 284.1 -266.8C287.5 -264.7 292.4 -261.3 294 -260.2" fill="none" stroke="#6ee7b7" stroke-width="3.1"/><circle cx="37" cy="46.3" r="4.3" fill="#6ee7b7"/></g><text x="80" y="1030" fill="#9aa1af" font-size="22.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif" letter-spacing="1.6">CONSTRUCTION</text><text x="80" y="1074" fill="#6b7280" font-size="19.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif">bowl</text><text x="220" y="1074" fill="#6ee7b7" font-size="19.2" font-family="ui-monospace,'Cascadia Code',Consolas,monospace">r = r₀·e^(bθ)</text><text x="580" y="1074" fill="#6b7280" font-size="18.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif">the mint curve IS the outer contour</text><text x="80" y="1104" fill="#6b7280" font-size="19.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif">growth</text><text x="220" y="1104" fill="#6ee7b7" font-size="19.2" font-family="ui-monospace,'Cascadia Code',Consolas,monospace">b = lnφ/sweep = 0.08967</text><text x="580" y="1104" fill="#6b7280" font-size="18.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif">radius ×φ from junction to terminal</text><text x="80" y="1134" fill="#6b7280" font-size="19.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif">weight</text><text x="220" y="1134" fill="#6ee7b7" font-size="19.2" font-family="ui-monospace,'Cascadia Code',Consolas,monospace">R/φ³</text><text x="580" y="1134" fill="#6b7280" font-size="18.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif">modulated ×φ on the stress axis</text><text x="80" y="1164" fill="#6b7280" font-size="19.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif">crossbar</text><text x="220" y="1164" fill="#6ee7b7" font-size="19.2" font-family="ui-monospace,'Cascadia Code',Consolas,monospace">eye : counter = 1 : φ</text><text x="580" y="1164" fill="#6b7280" font-size="18.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif">golden section of the counter</text><text x="80" y="1194" fill="#6b7280" font-size="19.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif">aperture</text><text x="220" y="1194" fill="#6ee7b7" font-size="19.2" font-family="ui-monospace,'Cascadia Code',Consolas,monospace">360/φ⁴ = 52.5°</text><text x="580" y="1194" fill="#6b7280" font-size="18.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif">wedge removed at the lower right</text><text x="80" y="1254" fill="#6b7280" font-size="16.1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif">The canonical golden spiral grows ×φ every quarter turn,</text><text x="80" y="1278" fill="#6b7280" font-size="16.1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif">b = 2·lnφ/π ≈ 0.30635. Across this letter's 307.5° sweep</text><text x="80" y="1302" fill="#6b7280" font-size="16.1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif">that compounds to φ^3.42 ≈ 5.6×, which stops reading as an 'e'.</text><text x="80" y="1326" fill="#6b7280" font-size="16.1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif">So the bowl uses the same equation tuned to grow ×φ across the</text><text x="80" y="1350" fill="#6b7280" font-size="16.1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif">whole sweep instead: b = lnφ/sweep.</text></svg>