[package]
name = "e"
version = "0.1.4"
description = "e — a minimalist, fast, extensible agent harness GUI"
edition = "2021"
default-run = "e"

[lib]
name = "e_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
futures-util = "0.3"
dirs = "6"
# Real pseudo-terminals for the right pane's terminal tabs: ConPTY on Windows,
# openpty elsewhere, behind one API.
portable-pty = "0.9"
keyring = { version = "3", features = ["windows-native"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
